---

# This is a host file for usage with the `../bin/ansible-all-hosts.sh` script,
# which runs Ansible against a bunch of hosts, each with its own `sudo` password.
# Use an SSH user that can run sudo, and do not add `become` settings here: the playbook runs sudo itself
# and picks the right account for each task (see "Privilege escalation settings" in docs/installing.md).
matrix_servers:
  hosts:
    matrix.<your domain>:
      ansible_host: <your server's external ip address>
      ansible_ssh_user: <your ssh user>

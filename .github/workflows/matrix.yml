---
name: Matrix CI

on: [push, pull_request]  # yamllint disable-line rule:truthy

permissions:
  contents: read

jobs:
  matrix-playbook-preflight:
    name: Test playbook preflight (ansible-core ${{ matrix.ansible_core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible_core: "2.15.1"
            python: "3.11"
          - ansible_core: "2.21.3"
            python: "3.12"

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Ansible
        run: python -m pip install "ansible-core==${{ matrix.ansible_core }}"

      - name: Test playbook preflight
        run: tests/matrix-playbook-preflight.sh

  prek:
    name: Run prek hooks
    runs-on: ubuntu-latest
    container:
      image: docker.io/archlinux:base-devel

    steps:
      # git must be installed before checkout so it does a proper clone
      # (with .git directory) instead of a tarball download.
      - name: Install git
        run: pacman -Sy --noconfirm git

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore prek cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: var/prek
          key: arch-prek-v1-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: pacman -S --noconfirm --needed just mise python

      - name: Run prek hooks
        run: |
          # The checkout action sets safe.directory using its own bundled
          # git, which is separate from the pacman-installed git that prek uses.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          just prek-run-on-all
